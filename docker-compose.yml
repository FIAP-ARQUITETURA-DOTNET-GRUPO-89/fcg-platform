services:

  postgres:
    image: postgres:17
    container_name: fcg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fcg
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - fcg-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: fcg-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - fcg-network

  ####################################################
  # USERS API
  ####################################################

  users-api:
    image: jondamiao/fcg-users-api:latest
    container_name: fcg-users-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:7071
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=fcg;Username=postgres;Password=postgres
      ConnectionStrings__Rabbitmq: amqp://guest:guest@rabbitmq:5672
    ports:
      - "7071:7071"
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - fcg-network


  ####################################################
  # CATALOG API
  ####################################################

  catalog-api:
    image: jondamiao/fcg-catalog-api:latest
    container_name: fcg-catalog-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:7072
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=fcg;Username=postgres;Password=postgres
      ConnectionStrings__Rabbitmq: amqp://guest:guest@rabbitmq:5672
    ports:
      - "7072:7072"
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - fcg-network

  ####################################################
  # CATALOG WORKER
  ####################################################

  catalog-worker:
    image: jondamiao/fcg-catalog-worker:latest
    container_name: fcg-catalog-worker
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=fcg;Username=postgres;Password=postgres
      ConnectionStrings__Rabbitmq: amqp://guest:guest@rabbitmq:5672
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - fcg-network

  ####################################################
  # PAYMENTS API
  ####################################################

  payments-api:
    image: jondamiao/fcg-payments-api:latest
    container_name: fcg-payments-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:7074
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=fcg;Username=postgres;Password=postgres
      ConnectionStrings__Rabbitmq: amqp://guest:guest@rabbitmq:5672
    ports:
      - "7074:7074"
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - fcg-network

  ####################################################
  # PAYMENTS WORKER
  ####################################################

  payments-worker:
    image: jondamiao/fcg-payments-worker:latest
    container_name: fcg-payments-worker
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=fcg;Username=postgres;Password=postgres
      ConnectionStrings__Rabbitmq: amqp://guest:guest@rabbitmq:5672
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - fcg-network

  ####################################################
  # NOTIFICATIONS API
  ####################################################

  notifications-api:
    image: jondamiao/fcg-notifications-api:latest
    container_name: fcg-notifications-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:7073
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=fcg;Username=postgres;Password=postgres
      ConnectionStrings__Rabbitmq: amqp://guest:guest@rabbitmq:5672
    ports:
      - "7073:7073"
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - fcg-network

  ####################################################
  # NOTIFICATIONS WORKER
  ####################################################

  notifications-worker:
    image: jondamiao/fcg-notifications-worker:latest
    container_name: fcg-notifications-worker
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=fcg;Username=postgres;Password=postgres
      ConnectionStrings__Rabbitmq: amqp://guest:guest@rabbitmq:5672
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - fcg-network

volumes:
  postgres-data:

networks:
  fcg-network:
    driver: bridge