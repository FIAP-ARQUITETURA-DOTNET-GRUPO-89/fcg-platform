services:

  postgres:
    image: postgres:17
    container_name: fcg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fcg
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: fcg-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"

  users:
    image: jondamiao/fcg-users:1.0.0
    container_name: fcg-users
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:7071
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=fcg;Username=postgres;Password=postgres
      ConnectionStrings__Rabbitmq: amqp://guest:guest@rabbitmq:5672
    ports:
      - "7071:7071"
    depends_on:
      - postgres
      - rabbitmq

  catalog:
    image: jondamiao/fcg-catalog:1.0.0
    container_name: fcg-catalog
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:7072
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=fcg;Username=postgres;Password=postgres
      ConnectionStrings__Rabbitmq: amqp://guest:guest@rabbitmq:5672
    ports:
      - "7072:7072"
    depends_on:
      - postgres
      - rabbitmq

  payments:
    image: jondamiao/fcg-payments:1.0.0
    container_name: fcg-payments
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:7074
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=fcg;Username=postgres;Password=postgres
      ConnectionStrings__Rabbitmq: amqp://guest:guest@rabbitmq:5672
    ports:
      - "7074:7074"
    depends_on:
      - postgres
      - rabbitmq

  notifications:
    image: jondamiao/fcg-notifications:1.0.0
    container_name: fcg-notifications
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:7073
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=fcg;Username=postgres;Password=postgres
      ConnectionStrings__Rabbitmq: amqp://guest:guest@rabbitmq:5672
    ports:
      - "7073:7073"
    depends_on:
      - postgres
      - rabbitmq

volumes:
  postgres-data: