services:

  ####################################################
  # POSTGRES
  ####################################################

  postgres:
    image: postgres:17
    container_name: fcg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - fcg-network

  ####################################################
  # REDIS
  ####################################################

  redis:
    image: redis:7-alpine
    container_name: fcg-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - fcg-network

  ####################################################
  # MONGODB
  ####################################################

  mongodb:
    image: mongo:latest
    container_name: fcg-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - fcg-network

  ####################################################
  # RABBITMQ
  ####################################################

  rabbitmq:
    image: rabbitmq:3-management
    container_name: fcg-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - fcg-network

  ####################################################
  # USERS API
  ####################################################

  users-api:
    image: jondamiao/fcg-users-api:1.0.0
    container_name: fcg-users-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:7010
      RUN_MIGRATION: "true"

      JwtSettings__Issuer: FcgUsers-Issuer
      JwtSettings__SecurityKey: FcgUsers_Secret_Key_2026_High_Security_Token
      JwtSettings__ExpirationHours: "2"

      ConnectionStrings__Default: Host=postgres;Port=5432;Database=fcgusers-db;Username=postgres;Password=postgres
      ConnectionStrings__Rabbitmq: amqp://guest:guest@rabbitmq:5672

    ports:
      - "7010:7010"

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    networks:
      - fcg-network

  ####################################################
  # CATALOG API
  ####################################################

  catalog-api:
    image: jondamiao/fcg-catalog-api:1.0.0
    container_name: fcg-catalog-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:7030
      RUN_MIGRATION: "true"

      JwtSettings__Issuer: FcgUsers-Issuer
      JwtSettings__SecurityKey: FcgUsers_Secret_Key_2026_High_Security_Token
      JwtSettings__ExpirationHours: "2"

      ConnectionStrings__Default: Host=postgres;Port=5432;Database=fcgcatalog-db;Username=postgres;Password=postgres
      ConnectionStrings__Rabbitmq: amqp://guest:guest@rabbitmq:5672
      ConnectionStrings__redis: redis:6379
      ConnectionStrings__Mongo: mongodb://mongodb:27017

    ports:
      - "7030:7030"

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_started

    networks:
      - fcg-network

  ####################################################
  # CATALOG WORKER
  ####################################################

  catalog-worker:
    image: jondamiao/fcg-catalog-worker:1.0.0
    container_name: fcg-catalog-worker
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production

      JwtSettings__Issuer: FcgUsers-Issuer
      JwtSettings__SecurityKey: FcgUsers_Secret_Key_2026_High_Security_Token
      JwtSettings__ExpirationHours: "2"

      ConnectionStrings__Default: Host=postgres;Port=5432;Database=fcgcatalog-db;Username=postgres;Password=postgres
      ConnectionStrings__Rabbitmq: amqp://guest:guest@rabbitmq:5672
      ConnectionStrings__Mongo: mongodb://mongodb:27017

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_started
      catalog-api:
        condition: service_started

    networks:
      - fcg-network

  ####################################################
  # PAYMENTS API
  ####################################################

  payments-api:
    image: jondamiao/fcg-payments-api:1.0.0
    container_name: fcg-payments-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:7040
      RUN_MIGRATION: "true"

      JwtSettings__Issuer: FcgUsers-Issuer
      JwtSettings__SecurityKey: FcgUsers_Secret_Key_2026_High_Security_Token
      JwtSettings__ExpirationHours: "2"

      ConnectionStrings__Default: Host=postgres;Port=5432;Database=fcgpayments-db;Username=postgres;Password=postgres
      ConnectionStrings__Rabbitmq: amqp://guest:guest@rabbitmq:5672

    ports:
      - "7040:7040"

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    networks:
      - fcg-network

  ####################################################
  # PAYMENTS WORKER
  ####################################################

  payments-worker:
    image: jondamiao/fcg-payments-worker:1.0.0
    container_name: fcg-payments-worker
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production

      JwtSettings__Issuer: FcgUsers-Issuer
      JwtSettings__SecurityKey: FcgUsers_Secret_Key_2026_High_Security_Token
      JwtSettings__ExpirationHours: "2"

      ConnectionStrings__Default: Host=postgres;Port=5432;Database=fcgpayments-db;Username=postgres;Password=postgres
      ConnectionStrings__Rabbitmq: amqp://guest:guest@rabbitmq:5672

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      payments-api:
        condition: service_started

    networks:
      - fcg-network

  ####################################################
  # KONG API GATEWAY
  ####################################################

  kong:
    image: kong:3.9.3
    container_name: fcg-kong
    restart: unless-stopped

    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml

      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr

      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr

      KONG_ADMIN_LISTEN: 0.0.0.0:8001

    ports:
      - "8000:8000"
      - "8001:8001"

    volumes:
      - ./docker/infrastructure/kong/kong.yml:/etc/kong/kong.yml:ro

    networks:
      - fcg-network

  ####################################################
  # PROMETHEUS
  ####################################################

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: fcg-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
    ports:
      - "9090:9090"
    volumes:
      - ./docker/infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - fcg-network

  ####################################################
  # GRAFANA
  ####################################################

  grafana:
    image: grafana/grafana:11.3.0
    container_name: fcg-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - fcg-network

volumes:
  postgres-data:
  redis-data:
  mongodb-data:
  grafana-data:

networks:
  fcg-network:
    driver: bridge