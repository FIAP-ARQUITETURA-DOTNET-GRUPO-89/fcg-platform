apiVersion: v1
kind: Service

metadata:
  name: kong
  namespace: fcg-platform

  labels:
    app.kubernetes.io/name: kong
    app.kubernetes.io/instance: kong
    app.kubernetes.io/component: api-gateway
    app.kubernetes.io/part-of: fcg-platform
    app.kubernetes.io/managed-by: kubectl

spec:
  type: LoadBalancer

  selector:
    app.kubernetes.io/name: kong

  ports:
    - name: proxy
      port: 8000
      targetPort: proxy
