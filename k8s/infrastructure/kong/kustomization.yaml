apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fcg-platform

labels:
  - pairs:
      app.kubernetes.io/name: kong
      app.kubernetes.io/instance: kong
      app.kubernetes.io/component: api-gateway
      app.kubernetes.io/part-of: fcg-platform
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - deployment.yaml
  - service.yaml

# Template sem a chave JWT. O Secret "kong-config" (kong.yml final) é gerado
# pelo External Secrets na AWS ou por scripts/secrets.sh k8s no ambiente local.
configMapGenerator:
  - name: kong-config-template
    files:
      - kong.yml=kong.tmpl.yml
    options:
      disableNameSuffixHash: true
