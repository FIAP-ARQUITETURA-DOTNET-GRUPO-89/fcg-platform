# OpenSearch de nó único para ambientes locais (Docker Desktop, kind, minikube).
# Na AWS, a busca usa o Amazon OpenSearch Service gerenciado e este manifesto não é aplicado.
# Os dados ficam em emptyDir: se o pod for recriado, a CatalogAPI recria o índice
# e reindexa os jogos a partir do PostgreSQL na inicialização.
apiVersion: apps/v1
kind: Deployment

metadata:
  name: fcg-opensearch
  namespace: fcg-platform

  labels:
    app.kubernetes.io/name: fcg-opensearch
    app.kubernetes.io/instance: fcg-opensearch
    app.kubernetes.io/component: search
    app.kubernetes.io/part-of: fcg-platform
    app.kubernetes.io/managed-by: kubectl

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: fcg-opensearch

  template:
    metadata:
      labels:
        app.kubernetes.io/name: fcg-opensearch
        app.kubernetes.io/instance: fcg-opensearch
        app.kubernetes.io/component: search
        app.kubernetes.io/part-of: fcg-platform

    spec:
      securityContext:
        fsGroup: 1000

      containers:
        - name: fcg-opensearch
          image: opensearchproject/opensearch:2.19.1
          imagePullPolicy: IfNotPresent

          env:
            - name: discovery.type
              value: single-node
            - name: DISABLE_SECURITY_PLUGIN
              value: "true"
            - name: DISABLE_INSTALL_DEMO_CONFIG
              value: "true"
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms512m -Xmx512m"

          ports:
            - containerPort: 9200

          volumeMounts:
            - name: data
              mountPath: /usr/share/opensearch/data

          resources:
            requests:
              cpu: "100m"
              memory: "768Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

          livenessProbe:
            tcpSocket:
              port: 9200
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6

      volumes:
        - name: data
          emptyDir: {}
