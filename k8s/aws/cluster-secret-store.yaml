# Conecta o External Secrets Operator ao AWS Systems Manager Parameter Store.
# Sem bloco "auth": o operador usa a role IAM da própria service account
# (IRSA, criada em iac/terraform/aws/external-secrets.tf).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore

metadata:
  name: aws-parameter-store

  labels:
    app.kubernetes.io/part-of: fcg-platform
    app.kubernetes.io/component: secrets
    app.kubernetes.io/managed-by: kubectl

spec:
  provider:
    aws:
      service: ParameterStore
      region: us-east-1
