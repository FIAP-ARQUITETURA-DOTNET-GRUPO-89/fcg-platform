# Gerado a partir dos parâmetros SecureString em /fcg-platform/* (Parameter Store).
# Cada ExternalSecret cria um Secret com o MESMO nome que os Deployments já usam,
# e cada chave do JSON do parâmetro vira uma variável de ambiente no pod.
# Os parâmetros são publicados com: scripts/secrets.sh aws
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: postgres-secret
  namespace: fcg-platform

  labels:
    app.kubernetes.io/part-of: fcg-platform
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: external-secrets

spec:
  refreshInterval: 1h

  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-parameter-store

  target:
    name: postgres-secret
    creationPolicy: Owner

  dataFrom:
    - extract:
        key: /fcg-platform/postgres

