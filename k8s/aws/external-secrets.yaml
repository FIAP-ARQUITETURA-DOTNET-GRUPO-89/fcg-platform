---
# Kong: o kong.yml é gerado a partir do ConfigMap kong-config-template
# (k8s/infrastructure/kong/kong.tmpl.yml), trocando {{ .jwtSecret }} pela
# chave JWT guardada em /fcg-platform/kong.
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: kong-config
  namespace: fcg-platform

  labels:
    app.kubernetes.io/name: kong
    app.kubernetes.io/part-of: fcg-platform
    app.kubernetes.io/component: api-gateway
    app.kubernetes.io/managed-by: external-secrets

spec:
  refreshInterval: 1h

  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-parameter-store

  target:
    name: kong-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      templateFrom:
        - configMap:
            name: kong-config-template
            items:
              - key: kong.yml
                templateAs: Values

  data:
    - secretKey: jwtSecret
      remoteRef:
        key: /fcg-platform/kong
        property: JWT_SECRET
