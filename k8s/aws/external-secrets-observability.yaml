# Senha do admin do Grafana (kube-prometheus-stack usa grafana.admin.existingSecret).
# Aplicar depois que o namespace observability existir.
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: kube-prom-grafana
  namespace: observability

  labels:
    app.kubernetes.io/part-of: fcg-platform
    app.kubernetes.io/component: observability
    app.kubernetes.io/managed-by: external-secrets

spec:
  refreshInterval: 1h

  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-parameter-store

  target:
    name: kube-prom-grafana
    creationPolicy: Owner

  dataFrom:
    - extract:
        key: /fcg-platform/grafana
