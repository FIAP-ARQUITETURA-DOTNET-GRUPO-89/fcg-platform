apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fcg-platform-ingress
  namespace: fcg-platform
  labels:
    app.kubernetes.io/name: fcg-platform-ingress
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: fcg-platform
  annotations:
    kubernetes.io/ingress.class: "alb"
    alb.ingress.kubernetes.io/scheme: "internet-facing"
    alb.ingress.kubernetes.io/target-type: "ip"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
spec:
  rules:
    - http:
        paths:
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: fcg-users-api
                port:
                  number: 7010
          - path: /api/users
            pathType: Prefix
            backend:
              service:
                name: fcg-users-api
                port:
                  number: 7010
          - path: /api/games
            pathType: Prefix
            backend:
              service:
                name: fcg-catalog-api
                port:
                  number: 7030