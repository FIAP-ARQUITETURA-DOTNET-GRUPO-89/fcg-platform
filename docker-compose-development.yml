services:

  ####################################################  
  # POSTGRES  
  ####################################################
  postgres:
    image: postgres:17
    container_name: fcg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - fcg-network

  ####################################################
  # MONGODB
  ####################################################
  mongodb:
    image: mongo:latest
    container_name: fcg-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - fcg-network

  ####################################################
  # RABBITMQ  
  ####################################################
  rabbitmq:
    image: rabbitmq:3-management
    container_name: fcg-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - fcg-network

  ####################################################
  # USERS API  
  ####################################################
  users-api:
    container_name: fcg-users-api
    build:
      context: ./microservices/fcg-users
      dockerfile: src/FcgUsers.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:7010
      RUN_MIGRATION: "true"

      JwtSettings__Issuer: FcgUsers-Issuer
      JwtSettings__SecurityKey: FcgUsers_Secret_Key_2026_High_Security_Token
      JwtSettings__ExpirationHours: "2"

      ConnectionStrings__Default: Host=postgres;Port=5432;Database=fcgusers-db;Username=postgres;Password=postgres
      ConnectionStrings__Rabbitmq: amqp://guest:guest@rabbitmq:5672

    ports:
      - "7010:7010"

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    networks:
      - fcg-network

  ####################################################
  # CATALOG API  
  ####################################################
  catalog-api:
    container_name: fcg-catalog-api
    build:
      context: ./microservices/fcg-catalog
      dockerfile: src/FcgCatalog.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:7030
      RUN_MIGRATION: "true"

      JwtSettings__Issuer: FcgUsers-Issuer
      JwtSettings__SecurityKey: FcgUsers_Secret_Key_2026_High_Security_Token
      JwtSettings__ExpirationHours: "2"

      ConnectionStrings__Default: Host=postgres;Port=5432;Database=fcgcatalog-db;Username=postgres;Password=postgres
      ConnectionStrings__Rabbitmq: amqp://guest:guest@rabbitmq:5672
      ConnectionStrings__Mongo: mongodb://mongodb:27017

    ports:
      - "7030:7030"

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_started

    networks:
      - fcg-network

  ####################################################
  # CATALOG WORKER
  ####################################################
  catalog-worker:
    container_name: fcg-catalog-worker
    build:
      context: ./microservices/fcg-catalog
      dockerfile: src/FcgCatalog.Worker/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development

      JwtSettings__Issuer: FcgUsers-Issuer
      JwtSettings__SecurityKey: FcgUsers_Secret_Key_2026_High_Security_Token
      JwtSettings__ExpirationHours: "2"

      ConnectionStrings__Default: Host=postgres;Port=5432;Database=fcgcatalog-db;Username=postgres;Password=postgres
      ConnectionStrings__Rabbitmq: amqp://guest:guest@rabbitmq:5672
      ConnectionStrings__Mongo: mongodb://mongodb:27017

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_started
      catalog-api:
        condition: service_started

    networks:
      - fcg-network

  ####################################################
  # PAYMENTS API
  ####################################################
  payments-api:
    container_name: fcg-payments-api
    build:
      context: ./microservices/fcg-payments
      dockerfile: src/FcgPayments.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:7040
      RUN_MIGRATION: "true"

      JwtSettings__Issuer: FcgUsers-Issuer
      JwtSettings__SecurityKey: FcgUsers_Secret_Key_2026_High_Security_Token
      JwtSettings__ExpirationHours: "2"

      ConnectionStrings__Default: Host=postgres;Port=5432;Database=fcgpayments-db;Username=postgres;Password=postgres
      ConnectionStrings__Rabbitmq: amqp://guest:guest@rabbitmq:5672

    ports:
      - "7040:7040"

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    networks:
      - fcg-network

  ####################################################
  # PAYMENTS WORKER
  ####################################################
  payments-worker:
    container_name: fcg-payments-worker
    build:
      context: ./microservices/fcg-payments
      dockerfile: src/FcgPayments.Worker/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development

      JwtSettings__Issuer: FcgUsers-Issuer
      JwtSettings__SecurityKey: FcgUsers_Secret_Key_2026_High_Security_Token
      JwtSettings__ExpirationHours: "2"

      ConnectionStrings__Default: Host=postgres;Port=5432;Database=fcgpayments-db;Username=postgres;Password=postgres
      ConnectionStrings__Rabbitmq: amqp://guest:guest@rabbitmq:5672

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      payments-api:
        condition: service_started

    networks:
      - fcg-network

  ####################################################
  # NOTIFICATIONS WORKER
  ####################################################
  notifications-worker:
    container_name: fcg-notifications-worker
    build:
      context: ./microservices/fcg-notifications
      dockerfile: src/FcgNotifications.Worker/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      RUN_MIGRATION: "true"
      JwtSettings__Issuer: FcgUsers-Issuer
      JwtSettings__SecurityKey: FcgUsers_Secret_Key_2026_High_Security_Token
      JwtSettings__ExpirationHours: "2"

      ConnectionStrings__Default: Host=postgres;Port=5432;Database=fcgnotifications-db;Username=postgres;Password=postgres
      ConnectionStrings__Rabbitmq: amqp://guest:guest@rabbitmq:5672

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    networks:
      - fcg-network

  ####################################################
  # KONG API GATEWAY
  ####################################################
  kong:
    image: kong:3.9.3
    container_name: fcg-kong
    restart: unless-stopped

    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml

      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr

      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr

      KONG_ADMIN_LISTEN: 0.0.0.0:8001

    ports:
      - "8000:8000"
      - "8001:8001"

    volumes:
      - ./docker/infrastructure/kong/kong.yml:/etc/kong/kong.yml:ro

    networks:
      - fcg-network

volumes:
  postgres-data:
  mongodb-data:

networks:
  fcg-network:
    driver: bridge